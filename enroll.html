<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upis | Plesni  studio Ritam </title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <body class="bg-gray-50 text-gray-800"></body>

     <header class="sticky top-0 bg-white border-b border-gray-200"> 
        <div class="max-w-5xl mx-auto px-4 py-4 items-center justify-between">
            <a href="index.html" class="text-xl font-bold text-teal-700">Studio Ritam</a>
            <n av class="hidden md:flex gap-6">
                <a href="index.html" class="hover:text-teal-700">Naslovnica</a>
                <a href="schedule.html" class="hover:text-teal-700">Raspored</a>
                    <a href="enroll.html" class="hover:text-teal-700">Upis</a>
            </nav>
        </div>
    </header> 

  

  <section class="max-w-2xl mx-auto px-4 py-12">
    <h1 class="text-2xl font-bold mb-6">Upis na tečaj</h1>

    <form class="flex flex-col gap-4">

        <div class="flex flex-col md:flex-row gap-4">

            <div class="flex flex-col gap-1 w-full">
                <label for="name" class="text-sm font-medium">Ime i prezime</label>
                <input type="text" id="name" name="name border" class=border-gray-300 rounded-md px-3 py-2 focus:border-teal-600 focs:outline-none>
            </div>

            <div class="flex flex-col gap-1 w-full">
                <label for="email" class="text-sm font-medium">E-mail</label>
                <input type="email" id="email" name="email" class=border border-gray-300 rounded-md px-3 py-2 focus:border-teal-600 focs:outline-none>
                
            </div>

        </div>

        <div class="flex flex-col gap-1">
            <label for="message" class="text-sm font-medium">Koji tečaj te zanima?</label>
            <textarea id="message" name="message" rows="4"
            class="border border-gray-300 rounded-md px-3 py-2 focus:border-teal-600 focs:outline-none"></textarea>

        </div>

        <button class="bg-teal-700 text-white font-semibold px-6 py-3 rounded-lg hover:bg-teal-800">
            Pošalji prijavu.
        </button>

    </form>
  </section>

    <footer class="bg-gray-800 text-gray-300">
        <div class="max-w-5x1 mx-auto px-4 py8 flex flex-col md:flex-row justify-between gap-4 text-sm">
            <p>Plesni studio Ritam, Trg plesača 3, Koprivnica</p>
            <p>Radnim danom 16-21, subotom 9 - 13</p>
        </div>
    </footer>
</head>
